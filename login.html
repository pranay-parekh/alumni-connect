{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Log in - Alumni Connect{% endblock %}

{% block content %}
<div class="container auth-wrap">
  <section class="auth-card" aria-labelledby="login-title">
    <h1 id="login-title">Log in</h1>
    <p class="lead">Use the email you registered with.</p>

    <form method="post" action="{{ url_for('auth.login') }}">
      {{ csrf() }}
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

      <div class="field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" name="email" required autofocus
               autocomplete="email" value="{{ request.form.get('email', '') }}">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" name="password" required
               autocomplete="current-password">
      </div>

      <button class="btn btn-block" type="submit">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </section>
</div>
{% endblock %}
